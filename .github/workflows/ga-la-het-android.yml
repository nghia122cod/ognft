name: Gà La Hét – build Android APK

on:
  push:
    paths:
      - "ga-la-het/**"
      - ".github/workflows/ga-la-het-android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ga-la-het
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android
      - run: ./gradlew assembleDebug
        working-directory: ga-la-het/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ga-la-het.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ga-la-het-apk
          path: ga-la-het/ga-la-het.apk
